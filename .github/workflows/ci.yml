#
# The first CPU job installs stock JAX from PyPI and runs every test that
# carries neither marker of pyproject.toml, patched_stack or gpu. The second
# installs the JAX built from source, MaxText and MaxDiffusion, and runs the
# patched_stack tests too. The GPU job installs the JAX built from source with
# its ROCm plugin and runs the gpu tests that need one GPU. All take the
# versions of their other packages from .github/ci-constraints.txt.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The release scripts/publish_ci_wheels.sh made of the wheels of docs/getting_started.md;
  # .github/ci-wheels.sha256 names its wheels.
  WHEELS: jax-wheels-2026-11-10-6b39d49-rocm

jobs:
  cpu-tests:
    name: CPU tests (JAX from PyPI)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install JAX-Titan
        # Pinned: a new release must not turn main red. Bump a version in its own pull request.
        run: python -m pip install -e ".[test,plots]" jax==0.12.0.1 jaxlib==0.12.0.1 -c .github/ci-constraints.txt
      - name: Show installed versions
        run: python -m pip freeze
      - name: Run tests
        run: python -m pytest tests/ -m "not patched_stack"

  cpu-tests-source:
    name: CPU tests (JAX built from source)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Download the wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$WHEELS" --repo "$GITHUB_REPOSITORY" --dir wheels \
            --pattern 'jax-*.whl' --pattern 'jaxlib-*.whl' --pattern 'shardy_mpmd-*.whl'
          grep -v jax_rocm .github/ci-wheels.sha256 | sha256sum --check
      - name: Check out MaxDiffusion
        run: |
          commit=$(sed -n 's/^PINNED_COMMIT = "\(.*\)"$/\1/p' src/jax_titan/models/adapters/maxdiffusion.py)
          git init --quiet "$RUNNER_TEMP/maxdiffusion"
          cd "$RUNNER_TEMP/maxdiffusion"
          git fetch --quiet --depth 1 https://github.com/AI-Hypercomputer/maxdiffusion "${commit:?}"
          git checkout --quiet FETCH_HEAD
          git apply "$GITHUB_WORKSPACE"/third_party/patches/maxdiffusion-*.patch
      - name: Install JAX-Titan
        # --no-deps: MaxDiffusion's own requirements include PyTorch and TensorFlow.
        run: |
          python -m pip install wheels/*.whl -e ".[test,plots,maxtext,maxdiffusion]" -c .github/ci-constraints.txt
          python -m pip install --no-deps -e "$RUNNER_TEMP/maxdiffusion"
      - name: Show installed versions
        run: python -m pip freeze
      - name: Run tests
        run: python -m pytest tests/

  gpu-tests:
    name: GPU tests (MI350)
    runs-on: amd-do-linux.jax-titan.gpu.gfx950.1
    # A pull request from a fork never runs on a self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    container:
      image: ghcr.io/rocm/jax-base-ubu24.therock-10.1@sha256:9abb85fde7485b89db61f87d5f583bb1c3b980d479fff7d6d7ed988d652c57b3 # latest on 2026-11-13
      options: --device=/dev/kfd --device=/dev/dri --group-add video --shm-size 64G --env-file /etc/podinfo/gha-gpu-isolation-settings
    defaults:
      run:
        shell: bash
    env:
      # A GPU memory fault otherwise writes all GPU memory to the working directory as a core dump.
      HSA_DISABLE_COREDUMP_ON_EXCEPTION: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the GPUs
        run: |
          # TheRock images have no /opt/rocm; rocminfo is in the SDK's bin directory.
          export PATH="$(rocm-sdk path --bin):$PATH"
          rocminfo | grep gfx
      - name: Download the wheels
        run: |
          mkdir wheels
          while read -r _ file; do
            curl --fail --silent --show-error --location --output "$file" \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$WHEELS/$(basename "${file//+/%2B}")"
          done < .github/ci-wheels.sha256
          sha256sum --check .github/ci-wheels.sha256
      - name: Install JAX-Titan
        # --system-site-packages: the container's ROCm is a set of Python packages.
        run: |
          python3 -m venv --system-site-packages venv
          venv/bin/python -m pip install wheels/*.whl -e ".[test]" -c .github/ci-constraints.txt
      - name: Show installed versions
        run: venv/bin/python -m pip freeze
      - name: Run tests
        run: |
          # The ROCm plugin wheels do not bundle ROCm; they load the container's TheRock libraries.
          root=$(rocm-sdk path --root)
          export LD_LIBRARY_PATH="$root/lib:$root/lib/rocm_sysdeps/lib"
          venv/bin/python -m pytest tests/ --gpus=1 -rfEsP --durations=0
