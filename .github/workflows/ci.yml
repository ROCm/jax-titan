#
# The first CPU job installs stock JAX from PyPI and runs every test that
# carries neither marker of pyproject.toml, patched_stack or gpu. The second
# installs the JAX built from source and runs the patched_stack tests too.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cpu-tests:
    name: CPU tests (JAX from PyPI)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install JAX-Titan
        # Pinned: a new JAX release must not turn main red. Bump it in its own pull request.
        run: python -m pip install -e ".[test,plots]" jax==0.12.0.1 jaxlib==0.12.0.1
      - name: Show installed versions
        run: python -m pip freeze
      - name: Run tests
        run: python -m pytest tests/ -m "not patched_stack and not gpu"

  cpu-tests-source:
    name: CPU tests (JAX built from source)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # The release scripts/publish_ci_wheels.sh made of the wheels of docs/getting_started.md.
      WHEELS: jax-wheels-2026-11-10-6b39d49
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Download the wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$WHEELS" --repo "$GITHUB_REPOSITORY" --dir wheels --pattern '*.whl'
          sha256sum --check <<'EOF'
          5dde4075f64e8ca6d31f751847da72cfc5b189bba5bbd0612877b8d9acb19418  wheels/jax-0.12.1.dev0+selfbuilt-py3-none-any.whl
          599755d823708edae813036f7bae58110c8b8ab402c2390253601f542161dd3c  wheels/jaxlib-0.12.1.dev0+selfbuilt-cp312-cp312-manylinux_2_27_x86_64.whl
          29e924a3e978475af6689cd6ed491e7ecb80c566cb433b9e84058119df0f8410  wheels/shardy_mpmd-0.0.1-py3-none-any.whl
          EOF
      - name: Install JAX-Titan
        run: python -m pip install wheels/*.whl -e ".[test,plots]"
      - name: Show installed versions
        run: python -m pip freeze
      - name: Run tests
        run: python -m pytest tests/ -m "not gpu"

  gpu-smoke:
    name: GPU smoke test (MI350)
    runs-on: amd-do-linux.jax-titan.gpu.gfx950.1
    # A pull request from a fork never runs on a self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    container:
      image: ghcr.io/rocm/jax-base-ubu24.therock-10.1@sha256:9abb85fde7485b89db61f87d5f583bb1c3b980d479fff7d6d7ed988d652c57b3 # latest on 2026-11-13
      options: --device=/dev/kfd --device=/dev/dri --group-add video --shm-size 64G --env-file /etc/podinfo/gha-gpu-isolation-settings
    steps:
      - name: Show the GPUs
        run: |
          # TheRock images have no /opt/rocm; rocminfo is in the SDK's bin directory.
          export PATH="$(rocm-sdk path --bin):$PATH"
          rocminfo | grep gfx
