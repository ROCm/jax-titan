[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-titan"
dynamic = ["version"]
description = "A JAX-native MPMD training framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
# JAX-Titan also needs the patched jax/jaxlib/ROCm wheels and Shardy's
# `shardy-mpmd` JAX package; see docs/getting_started.md.
dependencies = [
    "absl-py",
    "immutabledict",
    "jaxtyping",
    "numpy",
    "optax",
    "orbax-checkpoint",
    "pyarrow",
    "tiktoken",
    "typing_extensions",
]

[project.optional-dependencies]
test = ["chex", "pytest"]
# Figures of training runs (jax_titan.observability.plot).
plots = ["matplotlib>=3.8"]
# The `triton` and `gluon` operator providers. JAX-Triton itself comes from the
# third_party/jax-triton submodule; see docs/getting_started.md.
triton = ["triton>=3.7"]
# MaxText models (jax_titan.models.adapters.maxtext). The maxtext package
# declares no dependencies; these are what its model code imports.
maxtext = [
    "maxtext==0.2.5",
    "aqtp",
    "drjax>=0.2.1",
    "flax",
    "grain",
    "huggingface_hub",
    "jinja2",
    "omegaconf",
    "pathwaysutils>=0.1.11",
    "pillow",
    "psutil",
    "pydantic",
    "qwix>=0.1.6",
    "sentencepiece",
    "sympy",
    "tokamax>=0.0.14,!=0.1.0",
    "tokenizers",
    "transformers>=5.8.0",
]
# MaxDiffusion FLUX.1 (jax_titan.models.adapters.maxdiffusion): what its model
# code imports. MaxDiffusion itself comes from a patched checkout; see
# docs/getting_started.md.
maxdiffusion = [
    "aqtp",
    "einops",
    "flax",
    "google-cloud-storage",
    "huggingface_hub",
    "pillow",
    "pyyaml",
    "requests",
    "tensorboardx",
]
# Hugging Face transformers' causal language models and diffusers' denoisers,
# through torchax (jax_titan.models.adapters.transformers and .diffusers).
# PyTorch only runs on the host while a model is traced, so its CPU build is
# enough: pip install --extra-index-url https://download.pytorch.org/whl/cpu.
# The versions are those the adapters were compared with PyTorch under.
transformers = ["torch==2.10.0", "torchax==0.0.13", "transformers==5.23.0"]
diffusers = ["torch==2.10.0", "torchax==0.0.13", "diffusers==0.43.0"]
# Ideogram 4 with published weights and real images: the text encoder's
# tokenizer and image files (jax_titan.models.ideogram_generate).
ideogram = ["pillow", "tokenizers"]
# Command A+ with a published checkpoint: its chat template, tokenizer and
# image files (jax_titan.data.command_a, jax_titan.models.command_a_generate).
command_a = ["jinja2>=3.1.6", "pillow", "tokenizers"]

[tool.setuptools.dynamic]
version = {attr = "jax_titan.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["jax_titan*"]

[tool.setuptools.package-data]
# Collective times measured with scripts/bench_collectives.sh, and the model config
# index (docs/planning.md).
"jax_titan.planning" = ["data/*.json", "data/models/*.json"]

[tool.pytest.ini_options]
addopts = "--strict-markers -rfEs"
markers = [
    "gpu(n): needs n GPUs, one by default; runs only with --gpus (tests/conftest.py)",
]
